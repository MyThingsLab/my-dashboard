# Which shelf each org repo renders on, and whether its backlog is governed
# by the CAD label schema (see mythings.labels / core ADR 0005). A repo listed
# nowhere renders under "Unshelved" — drift made visible, never dropped.

[shelves.development_harness]
label = "Development harness"
what = "designs and runs the autonomous cycle"
governed = true
repos = [
  "my-things-core",
  "my-template",
  "my-fleet",
  "my-coder",
  "my-orchestrator",
  "my-architect",
  "my-director",
  "my-guard",
  "my-tester",
  "my-reporter",
  "my-dashboard",
  "my-docs",
  "my-todo",
  "my-changelogger",
  "my-planner",
  "my-projector",
  "my-scaffolder",
  "my-pipeline",
]
# fleet-dispatch is retired (scripts moved to my-fleet in #58) and has 0 open
# issues to migrate — dropped rather than kept as a phantom harness slot. It
# renders under Unshelved: visible drift, not silently gone.

[shelves.services]
label = "Services"
what = "stays up, gets consumed"
governed = true
repos = [
  "my-server",
  "my-telegram-bot",
  "my-guide",
  "mythingslab.github.io",
  "typst-templates",
  "typst-personal-docs",
  ".github",
]

[shelves.study]
label = "Study"
what = "coursework, not fleet engineering"
repos = [
  "study",
  "my-uni",
  "my-professor",
  "my-syllabus",
  "my-flashcards",
  "my-grader",
  "my-glossary",
  "my-bibliography",
  "my-equations",
  "my-figure",
  "my-tables",
]

[shelves.casual_development]
label = "Casual development"
what = "make or learn something"
repos = [
  "my-idea",
  "my-typster",
  "my-presentation",
  "my-researcher",
  "my-site",
  "my-searcher",
  "my-scraper",
  "my-archivist",
  "my-librarian",
  "my-raytracer",
  "my-signal-processor",
  "my-manim-editor",
  "my-image-processor",
  "my-data-analysist",
  "my-notes",
  "my-cartographer",
  "my-designer",
  "my-embedder",
]
